# Sustituye a /etc/nginx/conf.d/default.conf de la imagen nginx-unprivileged (escucha en 8080, usuario sin privilegios).
# Sirve la SPA y hace de proxy inverso hacia el backend: mismo origen para el navegador, asi que no hace falta CORS.

# Cabecera Connection correcta para el proxy: "upgrade" solo cuando el cliente pide WebSocket.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Freno anti-fuerza-bruta por IP en login y registro (el backend tiene el suyo por (IP, email); este protege antes, sin
# gastar CPU de BCrypt ni hilos). Zona de 10 MB por endpoint (~160.000 IPs cada una).
limit_req_zone $binary_remote_addr zone=auth_login:10m    rate=10r/m;
limit_req_zone $binary_remote_addr zone=auth_registro:10m rate=5r/m;

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    server_tokens off;

    # IP real del cliente (OPCIONAL). Por defecto nginx usa la IP del par directo; con Docker Desktop (NAT) o tras un
    # balanceador/terminador TLS eso es la IP de la pasarela y TODOS los clientes comparten cubo en limit_req y en el
    # limitador del backend. Para corregirlo, el operador monta un fichero *.conf en /etc/nginx/realip/ (el directorio
    # esta vacio por defecto: el glob no casa con nada y nginx arranca igual). Ejemplo de realip/realip.conf:
    #     set_real_ip_from 172.16.0.0/12;      # solo el rango del proxy/balanceador de confianza, NUNCA 0.0.0.0/0 en produccion
    #     real_ip_header X-Forwarded-For;
    #     real_ip_recursive on;
    include /etc/nginx/realip/*.conf;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/xml image/svg+xml font/ttf application/vnd.ms-fontobject;

    # DNS interno de Docker: el nombre "backend" se resuelve al hacer cada peticion (no al arrancar nginx),
    # asi nginx arranca aunque el backend aun no exista y sigue la IP nueva si el contenedor se recrea.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # --- Proxy inverso -------------------------------------------------------------------------------------
    # X-Forwarded-For se SOBRESCRIBE con la IP que ve nginx (no se anade a lo que mande el cliente): el backend
    # (server.forward-headers-strategy=native) solo se fia de esa cabecera si el par directo es un proxy interno.
    # /api/auth/login: auth_login, rafaga de 5 sin retraso; pasada la rafaga, 429 con cuerpo JSON. El resto de /api/ no se toca.
    location = /api/auth/login {
        limit_req zone=auth_login burst=5 nodelay;
        limit_req_status 429;
        error_page 429 = @json429;
        error_page 413 = @json413;
        client_max_body_size 16k;
        set $backend "backend:8081";
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # /api/auth/registro: auth_registro, rafaga de 3 sin retraso; pasada la rafaga, 429 con cuerpo JSON. El resto de /api/ no se toca.
    location = /api/auth/registro {
        limit_req zone=auth_registro burst=3 nodelay;
        limit_req_status 429;
        error_page 429 = @json429;
        error_page 413 = @json413;
        client_max_body_size 16k;
        set $backend "backend:8081";
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /api/ {
        set $backend "backend:8081";
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        # fotos de incidencias: el backend admite 5 MB por archivo (6 MB por peticion); nginx por defecto corta en 1 MB
        client_max_body_size 6m;
        # por encima de ese tope nginx contesta solo (el backend ni se entera): que sea JSON como el resto de errores
        # de la API y no la pagina HTML por defecto
        error_page 413 = @json413;
    }

    location @json429 {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "60" always;
        include /etc/nginx/snippets/security-headers.conf;
        return 429 '{"error":"Demasiadas peticiones. Inténtalo de nuevo en un minuto"}';
    }

    location @json413 {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
        return 413 '{"error":"El archivo es demasiado grande"}';
    }

    # El health del backend es para el HEALTHCHECK interno del contenedor: no se publica (y tampoco debe caer
    # en el fallback de la SPA devolviendo un 200 engañoso).
    location ^~ /actuator {
        return 404;
    }

    # STOMP sobre WebSocket (notificaciones en tiempo real)
    location /ws {
        set $backend "backend:8081";
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_connect_timeout 5s;
        # la conexion vive mientras el usuario tenga la app abierta
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    # --- Estaticos -----------------------------------------------------------------------------------------
    # index.html (y cualquier ruta de la SPA, que cae aqui por try_files): nunca en cache, para que un despliegue
    # nuevo se vea al recargar.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp.conf;
    }

    # Ficheros con hash en el nombre (main-XXXX.js, styles-XXXX.css...): el contenido nunca cambia bajo el mismo nombre.
    # (la regex va entre comillas porque lleva llaves)
    location ~* "^/[^/]+-[A-Za-z0-9_-]{8}\.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|webp|avif|map)$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Resto de ficheros reales (favicon.ico...): cache corta. Cualquier otra ruta es de la SPA -> index.html.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "public, max-age=3600" always;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp.conf;
    }
}
