# Ajustes SOLO de test (se suman al application.properties de src/main y lo pisan; no lo sustituyen).
# En produccion el pool es de 20 con timeouts de sesion (lock_timeout, idle_in_transaction_session_timeout); en los tests:
#  - sin init SQL: varios tests esperan bloqueos durante decenas de segundos a proposito (interbloqueos), no deben cortarse;
#  - pool de 10 y espera larga: cada contexto distinto de Spring abre su propio pool contra un unico PostgreSQL
#    (max_connections=400, ver PostgresTestBase).
# PoolProduccionTests inyecta los valores reales de src/main para comprobarlos.
spring.datasource.hikari.connection-init-sql=
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
server.shutdown=immediate

# Limites anti-abuso del login/registro: en la suite casi todos los tests entran y se registran desde la MISMA IP
# (127.0.0.1 de MockMvc) en un mismo contexto cacheado, asi que con los valores de produccion se estorbarian entre si.
# Se suben aqui; las clases que prueban el limitador (AuthLimitesTests, AuthLimiteConcurrenciaTests, RealIp*Tests) fijan los
# valores de produccion (5 / 30 / 10) explicitamente y LimitesProduccionTests comprueba los de src/main.
vibora.seguridad.login-max-por-email=100000
vibora.seguridad.login-max-por-ip=100000
vibora.seguridad.registro-max-por-ip=100000
vibora.seguridad.refresco-max-por-ip=100000
