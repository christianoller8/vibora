spring.application.name=vibora
server.port=8081

# PostgreSQL (docker compose up -d db, desde la raíz del repo). El puerto del host es 15433 por defecto; si cambias
# POSTGRES_PORT en docker-compose.yml, define VIBORA_DB_PORT con el mismo valor.
spring.datasource.url=jdbc:postgresql://localhost:${VIBORA_DB_PORT:15433}/vibora
spring.datasource.username=vibora
spring.datasource.password=vibora

# Pool de conexiones (HikariCP).
#  - maximum-pool-size=20: una peticion con transaccion retiene UNA conexion; Tomcat atiende hasta 200 hilos pero casi toda
#    peticion es corta, y 20 conexiones saturan sobradamente un PostgreSQL pequeno (max_connections=100 por defecto, con
#    margen para migraciones, backups y mas de una instancia). Mas conexiones no dan mas caudal: encolan en la BD.
#  - connection-timeout=5000: si el pool esta agotado la peticion falla en 5 s (503 limpio) en vez de esperar 30 s.
#  - connection-init-sql (se ejecuta al crear CADA conexion; pgjdbc admite varias sentencias separadas por ';'):
#      lock_timeout=15s: una sentencia que espera un bloqueo de fila mas de 15 s falla (SQLSTATE 55P03 -> 409) en vez de colgarse;
#      idle_in_transaction_session_timeout=60s: PostgreSQL cierra la sesion que deja una transaccion abierta sin hacer
#      nada 60 s (cliente colgado), liberando sus bloqueos.
#    Los tests lo anulan (src/test/resources/config/application.properties): algunos esperan bloqueos a proposito.
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.connection-init-sql=set lock_timeout='15s'; set idle_in_transaction_session_timeout='60s'

# Apagado ordenado: al parar, Tomcat deja de aceptar peticiones nuevas y espera (hasta 20 s) a las que estan en curso
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# JPA: el esquema lo gestiona Flyway (db/migration), Hibernate solo valida
spring.jpa.hibernate.ddl-auto=validate
# Sentencias SQL en el log: apagado por defecto; para depurar, arrancar con --spring.jpa.show-sql=true
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true

# JWT (HMAC-SHA256)
# !!! SOLO DESARROLLO: este secreto por defecto es publico. En cualquier otro entorno
# !!! define la variable de entorno VIBORA_JWT_SECRET (>= 32 bytes, aleatorio).
vibora.jwt.secret=${VIBORA_JWT_SECRET:dev-only-secret-NO-USAR-EN-PRODUCCION-0123456789}
vibora.jwt.expiracion-minutos=15

# WebSocket (notificaciones en tiempo real, STOMP en /ws): origenes de navegador permitidos, separados por comas
vibora.websocket.origenes-permitidos=http://localhost:4200
# Latidos STOMP del servidor (ambos sentidos) y cada cuanto se cierran los sockets cuyo JWT ya caducó (ISO-8601)
vibora.websocket.latido=10s
vibora.websocket.intervalo-barrido=PT30S
# Sesiones STOMP simultaneas por persona (una mas recibe ERROR "Demasiadas conexiones" y se cierra)
vibora.websocket.max-sesiones-por-usuario=10

# Detras de nginx: Tomcat (RemoteIpValve) sustituye la IP del socket por la de X-Forwarded-For SOLO cuando el par directo
# es un proxy interno/privado (red de Docker, loopback); un X-Forwarded-For enviado por un cliente cualquiera se ignora.
server.forward-headers-strategy=native

# Limites anti-abuso (en memoria, POR INSTANCIA: con mas de una instancia hay que moverlos a Redis).
# Login: 5 intentos / 15 min por (IP, email) y 30 / 15 min por IP; un login correcto reinicia el par. Registro: 10 / hora por IP.
# Al superarlos: 429 con Retry-After (segundos). Los intentos se cuentan al admitirlos (exacto con peticiones simultaneas).
vibora.seguridad.login-max-por-email=5
vibora.seguridad.login-max-por-ip=30
vibora.seguridad.login-ventana=15m
vibora.seguridad.registro-max-por-ip=10
vibora.seguridad.registro-ventana=1h
vibora.seguridad.max-entradas=10000
vibora.seguridad.limpieza-intervalo=PT5M
# Renovaciones del token (POST /api/auth/refrescar): 60 FALLIDAS / 15 min por IP (las correctas y las que no traen cookie no cuentan; se cuenta tras la BD, asi que con mucha concurrencia puede pasarse un poco; en memoria, por instancia,
# 429 con Retry-After). Un 429 significa "reintenta mas tarde", no "sesion terminada": el cliente no debe descartar la sesion.
vibora.seguridad.refresco-max-por-ip=60
vibora.seguridad.refresco-ventana=15m

# Sesiones de refresco: el token de refresco va en la cookie HttpOnly "vibora_refresco" (Path=/api/auth, SameSite=Strict).
# Vida deslizante de cada token, tope absoluto desde el login, atributo Secure (false SOLO en desarrollo sin HTTPS) y purga
# diaria (cron de Spring, zona vibora.zona-horaria) por lotes de las caducadas o revocadas hace mas de un dia.
vibora.sesion.refresco-dias=14
vibora.sesion.maximo-dias=30
vibora.sesion.cookie-segura=${VIBORA_SESION_COOKIE_SEGURA:true}
vibora.sesion.purga-cron=0 0 4 * * *
vibora.sesion.lote=1000

# Actuator: SOLO /actuator/health (HEALTHCHECK de Docker); sin detalles ni componentes para nadie
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
# sin grupos liveness/readiness: la respuesta es exactamente {"status":"UP"}
management.endpoint.health.probes.enabled=false

# Documentacion OpenAPI (/v3/api-docs) y Swagger UI (/swagger-ui/index.html): APAGADAS por defecto (ambas rutas responden 404).
# `./mvnw spring-boot:run` las enciende (el plugin de Maven fija VIBORA_API_DOCS=true); en cualquier otro sitio, VIBORA_API_DOCS=true.
# Solo se documenta /api/** (ni actuator ni /error).
springdoc.api-docs.enabled=${VIBORA_API_DOCS:false}
springdoc.swagger-ui.enabled=${VIBORA_API_DOCS:false}
springdoc.paths-to-match=/api/**

# Fotos de incidencias: carpeta de ficheros subidos (en Docker: volumen vibora-uploads) y limites de multipart.
# Un fichero pasa de 5 MB -> 413. La peticion admite 1 MB mas por la envoltura multipart.
vibora.almacen.directorio=${VIBORA_ALMACEN_DIRECTORIO:./data/uploads}
# Procesado de imagenes: decodificaciones simultaneas (cada una ~64 MB con 16 MP), espera maxima por un permiso (despues 503),
# resolucion maxima en megapixeles, cuota de fotos por persona en 24 h (429) y barrido de temporales tmp-* huerfanos.
vibora.almacen.decodificaciones-simultaneas=2
vibora.almacen.espera-decodificacion=10s
vibora.almacen.max-megapixeles=16
vibora.almacen.cuota-diaria-por-usuario=40
vibora.almacen.limpieza-tmp-horas=1
vibora.almacen.limpieza-tmp-cron=0 15 * * * *
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# Tomcat rechaza una subida por su Content-Length (> max-request-size) SIN leer el cuerpo; si despues no puede descartar
# lo que queda (por defecto solo traga 2 MB) cierra la conexion y el cliente ve un corte en vez del 413. Con 10 MB el
# cliente recibe el 413 limpio hasta ~10 MB; por encima se corta la conexion (proteccion contra cuerpos enormes).
server.tomcat.max-swallow-size=10MB

# Reservas: duracion fija de cada casilla y antelacion minima para que un jugador pueda cancelar
vibora.reservas.duracion-minutos=90
vibora.reservas.cancelacion-minima-horas=24
# Antelacion maxima de una reserva (dia natural de la zona horaria, ese dia incluido) y tope de reservas ACTIVAS por jugador
# (confirmadas que aun no han empezado; apuntarse a un partido abierto no es reservar y no cuenta).
vibora.reservas.horizonte-dias=60
vibora.reservas.max-activas-por-usuario=10
# Se asume que todos los clubes estan en esta zona: los Instant se pasan a hora local para buscar tarifas y horario
vibora.zona-horaria=Europe/Madrid

# Retencion de notificaciones: purga diaria (cron de Spring, en la zona de arriba; por defecto 03:30) por lotes.
# Las leidas se conservan 90 dias; las no leidas 365 (el usuario aun puede querer verlas).
vibora.notificaciones.purga-activa=true
vibora.notificaciones.purga-cron=0 30 3 * * *
vibora.notificaciones.retencion-dias=90
vibora.notificaciones.retencion-no-leidas-dias=365
vibora.notificaciones.lote=1000

# Invitaciones del personal: el administrador invita a un correo y la persona acepta o rechaza.
# Validez en dias, tope de invitaciones PENDIENTES por club y tope de invitaciones creadas por club en 24 h (ambos 429),
# y barrido diario (cron de Spring, zona de arriba; por defecto 03:45) que marca CADUCADA las vencidas, por lotes.
vibora.personal.invitacion-dias=14
vibora.personal.max-pendientes-por-club=50
vibora.personal.max-invitaciones-por-club-24h=30
vibora.personal.lote=1000
vibora.personal.caducidad-cron=0 45 3 * * *
